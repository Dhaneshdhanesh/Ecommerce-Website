<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'base.html' %}

{% block content %}

<h2>Checkout</h2>

<div class="card p-4 shadow">

    <h4>Order Summary</h4>

    {% for item in items %}

        <p>
            {{ item.product.name }}
            × {{ item.quantity }}
            = ₹{{ item.subtotal }}
        </p>

    {% endfor %}

    <hr>

    <h4>Total: ₹{{ total }}</h4>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-success">
            Place Order
        </button>

    </form>

</div>

{% endblock %}
</body>
</html>
